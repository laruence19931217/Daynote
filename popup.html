<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Daynote · 随手记</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <a class="skip-link" href="#editor">跳到笔记编辑区</a>

    <main class="app-shell" aria-label="Daynote 随手记">
      <header class="app-header">
        <div class="brand" aria-label="Daynote">
          <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
            <path d="M7 4.5h10.5L22 9v14.5H7z" />
            <path d="M17.5 4.5V9H22M10.5 13h8M10.5 17h8M10.5 21h5" />
          </svg>
          <span>Daynote</span>
        </div>

        <div class="header-actions">
          <span class="local-badge">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M5.5 9V6.5a4.5 4.5 0 0 1 9 0V9" />
              <rect x="3.5" y="9" width="13" height="8.5" rx="2" />
            </svg>
            仅存本地
          </span>
          <button class="icon-button" id="themeToggle" type="button" aria-label="切换深色模式">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.5" />
              <path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56" />
            </svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z" />
            </svg>
          </button>
        </div>
      </header>

      <div class="workspace">
        <aside class="date-sidebar" aria-label="按日期查看笔记">
          <div class="sidebar-heading">
            <span>最近记录</span>
            <button class="today-button" id="todayButton" type="button">回到今天</button>
          </div>
          <nav class="date-list" id="dateList" aria-label="笔记日期"></nav>
        </aside>

        <article class="note-panel">
          <header class="note-header">
            <div>
              <p class="eyebrow" id="weekdayLabel"></p>
              <h1 id="dateHeading"></h1>
            </div>
            <button
              class="icon-button danger-button"
              id="clearButton"
              type="button"
              aria-label="清空当天笔记"
              title="清空当天笔记"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" />
              </svg>
            </button>
          </header>

          <div class="editor-toolbar" aria-label="文本格式工具">
            <button
              class="toolbar-button"
              id="boldButton"
              type="button"
              aria-label="加粗所选文字"
              aria-pressed="false"
              title="加粗（⌘/Ctrl + B）"
            >
              <strong>B</strong>
            </button>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <span class="shortcut-hint">换行记录，选中文字即可加粗</span>
          </div>

          <div class="editor-wrap">
            <div
              class="editor"
              id="editor"
              contenteditable="true"
              role="textbox"
              aria-label="当天的笔记内容"
              aria-multiline="true"
              data-placeholder="记下此刻的想法…"
              spellcheck="true"
            ></div>
          </div>

          <footer class="status-bar">
            <span class="save-state" id="saveState" role="status" aria-live="polite">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="m5.5 10.5 3 3 6-7" />
              </svg>
              <span id="saveStateText">已保存到本地</span>
            </span>
            <span id="characterCount">0 字</span>
          </footer>
        </article>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>

    <script src="scripts/popup.js"></script>
  </body>
</html>
